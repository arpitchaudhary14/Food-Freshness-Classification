version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MODEL_PATH=ml/models/best_finetuned_model.keras
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
    volumes:
      - ./ml/models:/app/ml/models:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data:
